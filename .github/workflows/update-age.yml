name: Update profile age

on:
  schedule:
    - cron: "17 0 24 * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update age
        shell: bash
        run: |
          set -euo pipefail

          today=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          year=${today:0:4}
          month_day=${today:5:2}${today:8:2}
          age=$((year - 2005))

          if [[ "$month_day" < "0724" ]]; then
            age=$((age - 1))
          fi

          sed -i -E "s/I'm\\+[0-9]+\\+years\\+old!/I'm+${age}+years+old!/" README.md
          sed -i -E "s/<!-- age-check: [0-9]{4}-[0-9]{2} -->/<!-- age-check: ${today:0:7} -->/" README.md

          grep -Fq "I'm+${age}+years+old!" README.md

          if git diff --quiet -- README.md; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update profile age to ${age}"
          git push
